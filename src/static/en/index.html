<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top Page</title>
    <meta name="description" content="fbsky provides Bluesky embedding card" />
    <meta property="og:title" content="fbsky" />
    <meta property="og:description" content="Bluesky embedding card" />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/form.css" />
    <script src="./js/url-converter.js" type="module" defer></script>
</head>

<body>
    <main>
        <h1 class="visually-hidden">Top Page</h1>
        <section class="converter-section">
            <!-- Read description first for screen readers -->
            <h2 class="visually-hidden">Bluesky URL to Embedding URL Converter</h2>
            <div class="reverse-container">
                <p class="converter-description card outlined">Generates a URL for displaying embeds on X, etc.
                    Enter a Bluesky URL and copy the generated embed URL.</p>
                <form onsubmit="return false;" class="card elevated form-card">
                    <label class="input-label">
                        Bluesky URL
                        <input type="url" name="url" id="url" class="input" />
                    </label>
                    <div id="fixedUrlArea" class="fixed-url-area" style="visibility: hidden;">
                        <span id="fixedUrlLabel" class="fixed-url-label">Embedding URL</span>
                        <div class="fixed-url-box card outlined" aria-labelledby="fixedUrlLabel">
                            <a id="fixedUrl" class="fixed-url" target="_blank" rel="noopener noreferrer"></a>
                        </div>
                    </div>
                    <button type="submit" id="copyFixedUrlButton" class="copy-fixed-url-button" aria-disabled="true">
                        Copy Embedding URL
                    </button>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
