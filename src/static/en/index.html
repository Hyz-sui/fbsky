<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <meta name="description" content="fbsky provides Bluesky embedding card" />
    <meta property="og:title" content="fbsky" />
    <meta property="og:description" content="Bluesky embedding card" />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/form.css" />
    <link rel="stylesheet" href="./css/snackbar.css" />
    <script src="./js/url-converter.js" type="module" defer></script>
</head>

<body>
    <main>
        <h1 class="visually-hidden">Home</h1>
        <section class="converter-section">
            <!-- Read description first for screen readers -->
            <h2 class="visually-hidden">Bluesky URL to Embedding URL Converter</h2>
            <div class="reverse-container">
                <p class="converter-description card outlined">Generates a URL for displaying embeds on X, etc.
                    Enter a Bluesky URL and copy the generated embed URL.</p>
                <form onsubmit="return false;" class="card elevated form-card">
                    <label class="input-label">
                        Bluesky URL
                        <input type="url" name="url" id="url" class="input" />
                    </label>
                    <!-- force language here if not English -->
                    <div class="card outlined block">
                        <label class="label-stretch-card">
                            <input type="checkbox" name="show-thumbnail" id="showThumbnail" class="input toggle"
                                aria-describedby="showThumbnailNote" />
                            Show thumbnail
                        </label>
                        <p class="note" id="showThumbnailNote">
                            Shows profile images or the first attached image on preview cards.
                        </p>
                    </div>
                    <div id="fixedUrlArea" class="fixed-url-area" style="visibility: hidden;">
                        <span id="fixedUrlLabel" class="fixed-url-label">Embedding URL</span>
                        <div class="fixed-url-box card outlined" aria-labelledby="fixedUrlLabel">
                            <a id="fixedUrl" class="fixed-url" target="_blank" rel="noopener noreferrer"></a>
                        </div>
                    </div>
                    <button type="submit" id="copyFixedUrlButton" class="copy-fixed-url-button" aria-disabled="true">
                        Copy Embedding URL
                    </button>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <ul class="footer-links">
            <li>
                <a href="./about/">About</a>
            </li>
            <li>
                <a href="https://bsky.app/profile/hyzsui.com" target="_blank" rel="noopener noreferrer">Developer</a>
            </li>
        </ul>
    </footer>
    <div id="snackbarBox" class="snackbar-box">
        <span id="snackbarIcon" class="snackbar-icon"></span>
        <span id="snackbarMessage" class="snackbar-message"></span>
        <button id="snackbarCloseButton" class="snackbar-close-button" aria-label="Close"></button>
    </div>
</body>

</html>
