<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>トップページ</title>
    <meta name="description" content="Blueskyの埋め込みカードを提供します。" />
    <meta property="og:title" content="fbsky" />
    <meta property="og:description" content="Blueskyの埋め込みカード" />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/form.css" />
    <link rel="stylesheet" href="./css/snackbar.css" />
    <script src="./js/url-converter.js" type="module" defer></script>
</head>

<body>
    <main>
        <h1 class="visually-hidden">トップページ</h1>
        <section class="converter-section">
            <!-- スクリーンリーダーでは先に説明を読む -->
            <h2 class="visually-hidden">BlueskyのURLから埋め込み用URLへの変換器</h2>
            <div class="reverse-container">
                <p class="converter-description card outlined">X等で埋め込みを表示させるためのURLを生成します。
                    BlueskyのURLを入力して、生成された埋め込み用URLをコピーしてください。</p>
                <form onsubmit="return false;" class="card elevated form-card">
                    <label class="input-label">
                        BlueskyのURL
                        <input type="url" name="url" id="url" class="input" />
                    </label>
                    <div id="fixedUrlArea" class="fixed-url-area" style="visibility: hidden;">
                        <span id="fixedUrlLabel" class="fixed-url-label">埋め込み用のURL</span>
                        <div class="fixed-url-box card outlined" aria-labelledby="fixedUrlLabel">
                            <a id="fixedUrl" class="fixed-url" target="_blank" rel="noopener noreferrer"></a>
                        </div>
                    </div>
                    <button type="submit" id="copyFixedUrlButton" class="copy-fixed-url-button" aria-disabled="true">
                        埋め込み用URLをコピー
                    </button>
                </form>
            </div>
        </section>
    </main>
    <div id="snackbarBox" class="snackbar-box">
        <span id="snackbarIcon" class="snackbar-icon"></span>
        <span id="snackbarMessage" class="snackbar-message"></span>
        <button id="snackbarCloseButton" class="snackbar-close-button">閉じる</button>
    </div>
</body>

</html>
