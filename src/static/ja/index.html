<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fiska</title>
    <meta name="description" content="Fiska: Blueskyのリンクカード生成ツールです。Blueskyのポストを引用リツイート風にシェアしましょう！" />
    <meta property="og:title" content="Fiska - Blueskyのリンクカード生成ツール" />
    <meta property="og:description" content="Blueskyのポストを引用リツイート風にシェアしましょう！" />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://fbsky.hyzsui.com/" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/form.css" />
    <link rel="stylesheet" href="./css/snackbar.css" />
    <script src="./js/url-converter.js" type="module" defer></script>
</head>

<body>
    <main>
        <h1 class="visually-hidden">Fiska</h1>
        <section class="converter-section">
            <!-- スクリーンリーダーでは先に説明を読む -->
            <h2 class="visually-hidden">BlueskyのURLから埋め込み用URLへの変換器</h2>
            <div class="reverse-container">
                <p class="converter-description card outlined">X等で埋め込みを表示させるためのURLを生成します。
                    BlueskyのURLを入力して、生成された埋め込み用URLをコピーしてください。</p>
                <form onsubmit="return false;" class="card elevated form-card">
                    <label class="input-label">
                        BlueskyのURL
                        <input type="url" name="url" id="url" class="input" />
                    </label>
                    <div class="card part-top outlined block">
                        <label class="label-stretch-card">
                            <input type="checkbox" name="lang" id="lang" data-language="ja"
                                class="input toggle deferred" aria-describedby="langNote" />
                            日本語表示を強制する
                        </label>
                        <p class="note" id="langNote">
                            日本語を強制しない場合、X等一部のサービスでは英語で埋め込みが表示されます。埋め込み内のテキストを日本語にしたい場合、オンに設定してください。
                        </p>
                    </div>
                    <div class="card part-bottom outlined block">
                        <label class="label-stretch-card">
                            <input type="checkbox" name="show-thumbnail" id="showThumbnail"
                                class="input toggle deferred" aria-describedby="showThumbnailNote" />
                            サムネイルを表示する
                        </label>
                        <p class="note" id="showThumbnailNote">
                            オンに設定すると、埋め込みにプロフィール画像や添付画像の1枚目などが表示されます。
                        </p>
                    </div>
                    <div id="fixedUrlArea" class="fixed-url-area" style="visibility: hidden;">
                        <span id="fixedUrlLabel" class="fixed-url-label">埋め込み用のURL</span>
                        <div class="fixed-url-box card outlined" aria-labelledby="fixedUrlLabel">
                            <a id="fixedUrl" class="fixed-url" target="_blank" rel="noopener noreferrer"></a>
                        </div>
                    </div>
                    <ul class="actions-list">
                        <li>
                            <button type="button" id="postXButton" class="post-x-button outlined" aria-disabled="true">
                                <div aria-hidden="true" class="button-icon">
                                    <svg viewBox="0 0 1200 1227">
                                        <path
                                            d="M714.163 519.284L1160.89 0H1055.03L667.137 450.887L357.328 0H0L468.492 681.821L0 1226.37H105.866L515.491 750.218L842.672 1226.37H1200L714.137 519.284H714.163ZM569.165 687.828L521.697 619.934L144.011 79.6944H306.615L611.412 515.685L658.88 583.579L1055.08 1150.3H892.476L569.165 687.854V687.828Z" />
                                    </svg>
                                </div>
                                埋め込み用URLを使ってXに投稿する
                                <small class="button-description">
                                    埋め込み用URLが入力された状態で、Xの投稿作成画面を開きます。
                                </small>
                            </button>
                        </li>
                        <li>
                            <button type="submit" id="copyFixedUrlButton" class="copy-fixed-url-button"
                                aria-disabled="true">
                                埋め込み用URLをコピー
                            </button>
                        </li>
                    </ul>
                </form>
            </div>
        </section>
    </main>
    <footer>
        <ul class="footer-links">
            <li>
                <a href="./このサイトについて/">このサイトについて</a>
            </li>
            <li>
                <a href="https://bsky.app/profile/hyzsui.com" target="_blank" rel="noopener noreferrer">開発者</a>
            </li>
            <li>
                <a href="https://github.com/Hyz-sui/fbsky" target="_blank" rel="noopener noreferrer">GitHub</a>
            </li>
        </ul>
    </footer>
    <div id="snackbarBox" class="snackbar-box">
        <span id="snackbarIcon" class="snackbar-icon"></span>
        <span id="snackbarMessage" class="snackbar-message"></span>
        <button id="snackbarCloseButton" class="snackbar-close-button" aria-label="閉じる"></button>
    </div>
</body>

</html>
